name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 15 * * 1"

permissions:
  contents: read

jobs:
  version:
    # Installs keep their cached copy until the version string changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: A plugin change carries a new version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          manifest=plugins/model-router/.claude-plugin/plugin.json
          if git diff --quiet "origin/$BASE" HEAD -- plugins/model-router ':(exclude)plugins/model-router/README.md'; then
            echo "No plugin change."; exit 0
          fi
          read_version() { python3 -c "import json,sys;print(json.load(sys.stdin)['version'])"; }
          version=$(read_version < "$manifest")
          base=$(git show "origin/$BASE:$manifest" | read_version)
          if [ "$version" = "$base" ]; then
            echo "::error file=$manifest::version $version is the same as on $BASE; set a version $BASE has never carried"; exit 1
          fi
          if [ -n "$(git tag -l "v$version")" ]; then
            echo "::error file=$manifest::version $version is already tagged v$version; set a new version"; exit 1
          fi
          echo "Version $version is new."

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          # setup-python has no 3.9 build for the newest Ubuntu image.
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  mod:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Mod tests
        shell: bash  # the same quoting on every OS; node expands the glob itself
        run: node --experimental-strip-types --test "tests/mod/*.test.ts"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Type-check the mod and its test
        # Node runs the tests with types stripped, so only tsc sees a type error.
        run: sh tests/mod/typecheck.sh

  validate:
    strategy:
      fail-fast: false
      matrix:
        # The plugin's floor, the version it was last tested on, and the newest release.
        claude-code: ["2.1.329", "2.1.331", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/model-router

  eval:
    # Runs live models on the API key's bill, so only by hand and once a week.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code
        # The weekly run takes the newest release, so a change upstream shows end to end.
        run: npm install -g @anthropic-ai/claude-code@${{ github.event_name == 'schedule' && 'latest' || '2.1.331' }}
      - name: Routing evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # No --model: it would override the session model each case sets for itself.
        run: |
          claude plugin eval plugins/model-router --trust-plugin --json results.json \
            --threshold 0.8 --max-cost-usd 2 --no-publish
      - name: Show the result
        if: always()
        run: cat results.json || true
