name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 15 * * 1"

permissions:
  contents: read

jobs:
  version:
    # Installs keep their cached copy until the version string changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A plugin change carries a new version
        env:
          BASE: ${{ github.base_ref }}
        run: python3 tools/plugin_version.py "origin/$BASE"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          # setup-python has no 3.9 build for the newest Ubuntu image.
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  mod:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Mod tests
        shell: bash  # the same quoting on every OS; node expands the glob itself
        run: node --experimental-strip-types --test "tests/mod/*.test.ts"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Type-check the mod and its test
        # Node runs the tests with types stripped, so only tsc sees a type error.
        run: sh tests/mod/typecheck.sh

  validate:
    strategy:
      fail-fast: false
      matrix:
        # The plugin's floor, the version it was last tested on, and the newest release.
        claude-code: ["2.1.329", "2.1.331", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/model-router

  eval:
    # Runs live models on the API key's bill, so only by hand and once a week.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        # The weekly run takes the newest release, so a change upstream shows end to end.
        run: npm install -g @anthropic-ai/claude-code@${{ github.event_name == 'schedule' && 'latest' || '2.1.331' }}
      - name: Routing evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # No --model: it would override the session model each case sets for itself.
        run: |
          claude plugin eval plugins/model-router --trust-plugin --json results.json \
            --threshold 0.8 --max-cost-usd 2 --no-publish
      - name: Show the result
        if: always()
        run: cat results.json || true
