name: Upstream watch

# Compares upstream Claude Code docs, changelog and models with compat/baseline.json and keeps one open issue
# listing what changed; it never edits the plugin. A page that fails to load or parses empty fails the job.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compare upstream with baseline
        run: |
          python tools/upstream_check.py \
            --baseline compat/baseline.json --json-out changes.json > report.md
          cat report.md
      - name: Open or update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(python -c "import json;print(int(json.load(open('changes.json'))['pending']))")
          if [ "$pending" != "1" ]; then echo "Nothing to review."; exit 0; fi
          title="Upstream Claude Code changes to review"
          {
            echo "The daily upstream check found changes since \`compat/baseline.json\` was last updated."
            echo
            echo '~~~~'
            cat report.md
            echo '~~~~'
            echo
            echo "To review: open this repo in Claude Code and run \`/refresh\`, or update the plugin by hand, then refresh the baseline with"
            echo "\`python3 tools/upstream_check.py --baseline compat/baseline.json --write\` in the same PR."
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

  newest:
    # It runs whatever npm and GitHub serve as newest, so it gets no issue rights.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the newest Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/model-router
      - name: Type-check the mod against the newest published types
        if: always()
        run: TYPES_COMMIT=main sh tests/mod/typecheck.sh
