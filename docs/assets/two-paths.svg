<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Two control paths, one router</title>
  <desc id="desc">Claude Code engine events reach the mod, hooks/router.ts. Settings hooks in hooks/hooks.json are the fallback and do the bookkeeping. Both run sh model-router.sh, which calls one Python runtime that decides every spawn.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .mod { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .hooks { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #57606a; stroke-width: 1; }
    .arrow { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .head { fill: #57606a; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .m { font-size: 12px; fill: #59636e; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #8b949e; stroke-width: 1.2; }
      .mod { fill: #0c2d6b; stroke: #58a6ff; stroke-width: 1.5; }
      .hooks { fill: #2b1a4a; stroke: #bc8cff; stroke-width: 1.5; }
      .chip { fill: #0d1117; stroke: #8b949e; stroke-width: 1; }
      .arrow { stroke: #8b949e; stroke-width: 1.6; fill: none; marker-end: url(#head); }
      .head { fill: #8b949e; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .m { font-size: 12px; fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="420" rx="10"/>

  <rect class="panel" x="20" y="20" width="420" height="80" rx="8"/>
  <text class="h" x="36" y="44">Claude Code engine events</text>
  <rect class="chip" x="36" y="58" width="92" height="26" rx="5"/><text class="code" x="45" y="75">agent.spawn</text>
  <rect class="chip" x="135" y="58" width="85" height="26" rx="5"/><text class="code" x="144" y="75">turn.start</text>
  <rect class="chip" x="227" y="58" width="78" height="26" rx="5"/><text class="code" x="236" y="75">turn.step</text>
  <rect class="chip" x="312" y="58" width="105" height="26" rx="5"/><text class="code" x="321" y="75">turn.complete</text>

  <path class="arrow" d="M230,100 L230,128"/>
  <rect class="mod" x="20" y="130" width="420" height="74" rx="8"/>
  <text class="h" x="36" y="154">The mod: hooks/router.ts</text>
  <text class="s" x="36" y="174">Primary path. Sets each spawn's model and its</text>
  <text class="s" x="36" y="192">effort per request, and raises a hard turn's effort.</text>

  <rect class="panel" x="460" y="20" width="420" height="184" rx="8"/>
  <text class="h" x="476" y="44">Settings hooks: hooks/hooks.json</text>
  <text class="code" x="476" y="68">SessionStart  UserPromptSubmit  PreToolUse</text>
  <text class="code" x="476" y="88">PostToolUse  PostToolUseFailure  SubagentStop</text>
  <text class="code" x="476" y="108">PostModelSwitch  Stop</text>
  <rect class="hooks" x="476" y="122" width="388" height="66" rx="6"/>
  <text class="s" x="490" y="144">Fallback: PreToolUse rewrites the Agent call</text>
  <text class="s" x="490" y="162">where mods don't load, and stands down once</text>
  <text class="s" x="490" y="180">the mod has announced itself for the session.</text>

  <path class="arrow" d="M230,204 L230,250 L400,250 L400,286"/>
  <path class="arrow" d="M670,204 L670,250 L500,250 L500,286"/>
  <text class="code" x="244" y="232">sh model-router.sh mod-*</text>
  <text class="code" x="684" y="232">sh model-router.sh &lt;event&gt;</text>

  <rect class="panel" x="140" y="288" width="620" height="112" rx="8"/>
  <text class="h" x="160" y="314">scripts/modelrouter: one Python runtime, one router</text>
  <rect class="chip" x="160" y="328" width="52" height="26" rx="5"/><text class="code" x="169" y="345">spawn</text>
  <rect class="chip" x="219" y="328" width="105" height="26" rx="5"/><text class="code" x="228" y="345">router.decide</text>
  <rect class="chip" x="331" y="328" width="58" height="26" rx="5"/><text class="code" x="340" y="345">ladder</text>
  <rect class="chip" x="396" y="328" width="72" height="26" rx="5"/><text class="code" x="405" y="345">registry</text>
  <rect class="chip" x="475" y="328" width="65" height="26" rx="5"/><text class="code" x="484" y="345">profile</text>
  <rect class="chip" x="547" y="328" width="52" height="26" rx="5"/><text class="code" x="556" y="345">calls</text>
  <rect class="chip" x="606" y="328" width="52" height="26" rx="5"/><text class="code" x="615" y="345">learn</text>
  <rect class="chip" x="665" y="328" width="52" height="26" rx="5"/><text class="code" x="674" y="345">gates</text>
  <text class="m" x="160" y="382">One decision procedure and one state store for both paths.</text>
</svg>
