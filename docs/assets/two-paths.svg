<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="Claude Code engine events, such as agent.spawn, turn.start, turn.step and turn.complete, reach the mod, hooks/router.ts. With a person at the prompt, the mod also shows the status line, serves /model-router and runs the session check. Settings hooks in hooks/hooks.json (SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PostToolUseFailure, SubagentStop, PostModelSwitch, Stop) do the bookkeeping and are the fallback. Both run sh model-router.sh, which calls one Python runtime that decides every spawn.">
<title>Two control paths, one router</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}</style>
<rect x="0.5" y="0.5" width="919" height="539" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">Two paths, one router</text><text x="32" y="66" class="mut" font-size="13.5">Both paths run the same launcher and the same Python runtime, so one router decides every spawn.</text><rect x="32" y="92" width="410" height="96" rx="12" class="faint" stroke-width="0"/><text x="52" y="120" class="ink b" font-size="14.5">Claude Code engine events</text><rect x="52" y="140" width="93" height="26" rx="6" class="card" stroke-width="1"/><text x="61" y="157.14" class="mono ink" font-size="11.5">agent.spawn</text><rect x="151.165" y="140" width="86" height="26" rx="6" class="card" stroke-width="1"/><text x="160.165" y="157.14" class="mono ink" font-size="11.5">turn.start</text><rect x="243.315" y="140" width="79" height="26" rx="6" class="card" stroke-width="1"/><text x="252.315" y="157.14" class="mono ink" font-size="11.5">turn.step</text><rect x="328.45" y="140" width="107" height="26" rx="6" class="card" stroke-width="1"/><text x="337.45" y="157.14" class="mono ink" font-size="11.5">turn.complete</text><rect x="32" y="222" width="410" height="126" rx="12" class="card" stroke-width="1"/><rect x="33" y="238" width="4" height="94" rx="2" class="r2"/><text x="52" y="252" class="ink b" font-size="15">The mod: hooks/router.ts</text><text x="52" y="276" class="mut" font-size="13">Primary path. Sets each spawn's model, and its effort</text><text x="52" y="295" class="mut" font-size="13">on each model request, for teammates and workflow</text><text x="52" y="314" class="mut" font-size="13">stages too. With a person at the prompt: the status</text><text x="52" y="333" class="mut" font-size="13">line, /model-router and the session check.</text><rect x="478" y="92" width="410" height="256" rx="12" class="faint" stroke-width="0"/><text x="498" y="120" class="ink b" font-size="14.5">Settings hooks: hooks/hooks.json</text><rect x="498" y="138" width="100" height="26" rx="6" class="card" stroke-width="1"/><text x="507" y="155.14" class="mono ink" font-size="11.5">SessionStart</text><rect x="606.18" y="138" width="128" height="26" rx="6" class="card" stroke-width="1"/><text x="615.18" y="155.14" class="mono ink" font-size="11.5">UserPromptSubmit</text><rect x="742.42" y="138" width="86" height="26" rx="6" class="card" stroke-width="1"/><text x="751.42" y="155.14" class="mono ink" font-size="11.5">PreToolUse</text><rect x="498" y="172" width="93" height="26" rx="6" class="card" stroke-width="1"/><text x="507" y="189.14" class="mono ink" font-size="11.5">PostToolUse</text><rect x="599.165" y="172" width="142" height="26" rx="6" class="card" stroke-width="1"/><text x="608.165" y="189.14" class="mono ink" font-size="11.5">PostToolUseFailure</text><rect x="749.435" y="172" width="100" height="26" rx="6" class="card" stroke-width="1"/><text x="758.435" y="189.14" class="mono ink" font-size="11.5">SubagentStop</text><rect x="498" y="206" width="121" height="26" rx="6" class="card" stroke-width="1"/><text x="507" y="223.14" class="mono ink" font-size="11.5">PostModelSwitch</text><rect x="627.225" y="206" width="44" height="26" rx="6" class="card" stroke-width="1"/><text x="636.225" y="223.14" class="mono ink" font-size="11.5">Stop</text><rect x="498" y="256" width="370" height="72" rx="10" class="card" stroke-width="1"/><rect x="499" y="268" width="4" height="48" rx="2" class="r4"/><text x="516" y="278" class="mut" font-size="12.5">Fallback: PreToolUse rewrites the Agent call where</text><text x="516" y="296" class="mut" font-size="12.5">mods don't load, and stands down for each call</text><text x="516" y="314" class="mut" font-size="12.5">the mod's tool.call hook marked.</text><path d="M237 188V216M232 211L237 216L242 211" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M237 348V374H410V398M405 393L410 398L415 393" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M683 348V374H510V398M505 393L510 398L515 393" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="367" class="mono mut" font-size="11.5">sh model-router.sh mod-*</text><text x="696" y="367" class="mono mut" font-size="11.5">sh model-router.sh &lt;event&gt;</text><rect x="132" y="404" width="656" height="110" rx="12" class="card" stroke-width="1"/><rect x="133" y="420" width="4" height="78" rx="2" class="rt"/><text x="156" y="434" class="ink b" font-size="15">scripts/modelrouter: one Python runtime, one router</text><rect x="156" y="450" width="51" height="26" rx="6" class="card" stroke-width="1"/><text x="165" y="467.14" class="mono ink" font-size="11.5">spawn</text><rect x="215.075" y="450" width="107" height="26" rx="6" class="card" stroke-width="1"/><text x="224.075" y="467.14" class="mono ink" font-size="11.5">router.decide</text><rect x="330.27" y="450" width="58" height="26" rx="6" class="card" stroke-width="1"/><text x="339.27" y="467.14" class="mono ink" font-size="11.5">ladder</text><rect x="396.36" y="450" width="72" height="26" rx="6" class="card" stroke-width="1"/><text x="405.36" y="467.14" class="mono ink" font-size="11.5">registry</text><rect x="476.48" y="450" width="51" height="26" rx="6" class="card" stroke-width="1"/><text x="485.48" y="467.14" class="mono ink" font-size="11.5">calls</text><rect x="535.555" y="450" width="51" height="26" rx="6" class="card" stroke-width="1"/><text x="544.555" y="467.14" class="mono ink" font-size="11.5">gates</text><text x="156" y="500" class="mut" font-size="13">One decision procedure and one state store for both paths.</text>
</svg>
