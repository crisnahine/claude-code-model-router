<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Strongest first: CLAUDE_CODE_SUBAGENT_MODEL_FORCE, then a model named on the call, then a per-agent rule in model-router.json, then the agent&#x27;s own model field, then CLAUDE_CODE_SUBAGENT_MODEL, then the level the agent&#x27;s tools put it at: lookup for an agent that can&#x27;t edit, write or run commands, standard for any other. For all but the two environment variables, the winner must be usable under the cap and your settings, else the next stronger usable model runs, or the strongest usable one when nothing stronger is left. A workflow agent whose script names no model runs on CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL when it is set. Effort is filled in from the model&#x27;s level when the call, a rule, the agent or its tools name the model, unless the call, the agent, CLAUDE_CODE_EFFORT_LEVEL or CLAUDE_CODE_SUBAGENT_EFFORT sets it.">
<title>Who decides the model: the order of authority</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}</style>
<rect x="0.5" y="0.5" width="919" height="519" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">Who decides the model</text><text x="32" y="66" class="mut" font-size="13.5">Strongest first: the first source that names a model wins.</text><rect x="32" y="92" width="560" height="52" rx="10" class="card" stroke-width="1"/><circle cx="62" cy="118" r="14" class="faint"/><text x="62" y="123" class="ink b" font-size="14" text-anchor="middle">1</text><text x="88" y="114" class="mono ink b" font-size="13">CLAUDE_CODE_SUBAGENT_MODEL_FORCE</text><text x="88" y="133" class="mut" font-size="12.5">pins every subagent's model; the router sets effort only</text><rect x="32" y="152" width="560" height="52" rx="10" class="card" stroke-width="1"/><circle cx="62" cy="178" r="14" class="faint"/><text x="62" y="183" class="ink b" font-size="14" text-anchor="middle">2</text><text x="88" y="174" class="ink b" font-size="14">A model named on the call</text><text x="88" y="193" class="mut" font-size="12.5">by Claude, a skill's instructions or a workflow script</text><rect x="32" y="212" width="560" height="52" rx="10" class="card" stroke-width="1"/><circle cx="62" cy="238" r="14" class="faint"/><text x="62" y="243" class="ink b" font-size="14" text-anchor="middle">3</text><text x="88" y="234" class="ink b" font-size="14">A per-agent rule</text><text x="88" y="253" class="mut" font-size="12.5">in ~/.claude/model-router.json or .claude/model-router.json</text><rect x="32" y="272" width="560" height="52" rx="10" class="card" stroke-width="1"/><circle cx="62" cy="298" r="14" class="faint"/><text x="62" y="303" class="ink b" font-size="14" text-anchor="middle">4</text><text x="88" y="294" class="ink b" font-size="14">The agent's own model field</text><text x="88" y="313" class="mut" font-size="12.5">in its definition's frontmatter</text><rect x="32" y="332" width="560" height="52" rx="10" class="card" stroke-width="1"/><circle cx="62" cy="358" r="14" class="faint"/><text x="62" y="363" class="ink b" font-size="14" text-anchor="middle">5</text><text x="88" y="354" class="mono ink b" font-size="13">CLAUDE_CODE_SUBAGENT_MODEL</text><text x="88" y="373" class="mut" font-size="12.5">your default for agents that name no model</text><rect x="32" y="392" width="560" height="52" rx="10" class="card" stroke-width="1"/><rect x="32.5" y="392.5" width="559" height="51" rx="10" class="rtsoft"/><circle cx="62" cy="418" r="14" class="faint"/><text x="62" y="423" class="ink b" font-size="14" text-anchor="middle">6</text><text x="88" y="414" class="ink b" font-size="14">The agent's tools</text><text x="88" y="433" class="mut" font-size="12.5">lookup if it can't edit, write or run commands, else standard</text><rect x="22" y="400" width="5" height="36" rx="2.5" class="rt"/><path d="M592 418H612V118H624M619 113L624 118L619 123" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="632" y="92" width="256" height="199" rx="12" class="card" stroke-width="1"/><rect x="633" y="108" width="4" height="167" rx="2" class="rt"/><text x="652" y="120" class="ink b" font-size="14.5">Then the cap</text><text x="652" y="146" class="mut" font-size="12.5">For 2, 3, 4 and 6, the winner has to</text><text x="652" y="165" class="mut" font-size="12.5">be usable: inside max_tier, allowed</text><text x="652" y="184" class="mut" font-size="12.5">by your availableModels and</text><text x="652" y="203" class="mut" font-size="12.5">deniedModels settings, and known to</text><text x="652" y="222" class="mut" font-size="12.5">work. If it isn't, the next stronger</text><text x="652" y="241" class="mut" font-size="12.5">usable model runs, else the strongest</text><text x="652" y="260" class="mut" font-size="12.5">usable one left.</text><rect x="632" y="307" width="256" height="157" rx="12" class="card" stroke-width="1"/><rect x="633" y="323" width="4" height="125" rx="2" class="r3"/><text x="652" y="335" class="ink b" font-size="14.5">And the effort</text><text x="652" y="361" class="mut" font-size="13">From the level of the model 2, 3,</text><text x="652" y="380" class="mut" font-size="13">4 or 6 gives, unless the call, the</text><text x="652" y="399" class="mut" font-size="13">agent or one of these sets it:</text><text x="652" y="424" class="mono ink" font-size="11.5">CLAUDE_CODE_EFFORT_LEVEL</text><text x="652" y="442" class="mono ink" font-size="11.5">CLAUDE_CODE_SUBAGENT_EFFORT</text><text x="32" y="476" class="mut" font-size="13">A workflow agent whose script names no model runs on CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL when it is set.</text><text x="32" y="496" class="mut" font-size="13">Example: a call that names sonnet and no effort runs on Sonnet at high. A rule's level raises a model below it.</text>
</svg>
