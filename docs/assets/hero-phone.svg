5">model and effort that should</text><text x="32" y="294" class="ink b" font-size="35">do the job.</text><text x="32" y="372" class="mut" font-size="22">When Claude marks a redo, effort</text><text x="32" y="404" class="mut" font-size="22">goes up first, then the model.</text><rect x="24" y="470" width="552" height="564.2" rx="23" class="card" stroke-width="1"/><text x="55.2" y="519.4" class="ink b" font-size="20">One agent call</text><g class="pbrief"><rect x="55.2" y="537.6" width="489.6" height="72.8" rx="13" class="faint" stroke-width="0"/><text x="73.4" y="574" class="mono ink" font-size="16">"Review the auth change</text><text x="73.4" y="600" class="mono ink" font-size="16">for security holes"</text></g><rect x="39.6" y="639" width="520.8" height="57.2" rx="13" class="rtsoft pband"/><path d="M68.2 639V1010.8M120.2 639V1010.8" class="lnm" stroke-width="5.85" stroke-linecap="round" opacity="0.4"/><path d="M68.2 979.6H120.2" class="r1s" stroke-width="7.8" stroke-linecap="round"/><text x="148.8" y="986.1" class="ink b" font-size="20">lookup</text><circle cx="265.08" cy="979.6" r="6.5" class="r1"/><text x="280.68" y="986.1" class="ink" font-size="20">Haiku</text><rect x="472" y="964" width="85" height="31" rx="15.5" class="faint"/><text x="514.28" y="985.26" class="mono ink" font-size="16" text-anchor="middle">medium</text><path d="M68.2 901.6H120.2" class="r2s" stroke-width="7.8" stroke-linecap="round"/><text x="148.8" y="908.1" class="ink b" font-size="20">standard</text><circle cx="265.08" cy="901.6" r="6.5" class="r2"/><text x="280.68" y="908.1" class="ink" font-size="20">Sonnet</text><rect x="472" y="886" width="85" height="31" rx="15.5" class="faint"/><text x="514.28" y="907.26" class="mono ink" font-size="16" text-anchor="middle">medium</text><path d="M68.2 823.6H120.2" class="r3s" stroke-width="7.8" stroke-linecap="round"/><text x="148.8" y="830.1" class="ink b" font-size="20">complex</text><circle cx="265.08" cy="823.6" r="6.5" class="r3"/><text x="280.6