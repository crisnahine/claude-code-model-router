<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1074" width="600" height="1074" role="img" aria-label="Model Router, a Claude Code plugin. An agent call to review an auth change runs on Opus at high effort, the complex level. Its result falls short, so Claude marks a redo and names no model on it. A redo raises effort before it changes model, and this run was already at high, so it moves to the next stronger model, frontier on Fable at high, and is solved. The ladder runs lookup on Haiku at medium, standard on Sonnet at medium, complex on Opus at high, hardest on Opus at xhigh and frontier on Fable at high.">
<title>Model Router: every Claude Code agent on the cheapest model that should do the job</title>
