<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
  <title id="title">The ladder: five levels to a model and an effort</title>
  <desc id="desc">With balanced priority, lookup runs on Haiku at low effort, standard on Sonnet at medium, complex on Sonnet at high, hardest on Opus at high, and frontier on Fable at high. Quality priority goes one step stronger, fast one step lighter. When the cap, the availableModels or deniedModels settings, or failures rule a model out, the pick moves to the nearest usable model above it, or to the strongest one left.</desc>
  <style>
    .bg { fill: #ffffff; }
    .rule { stroke: #57606a; stroke-width: 0.8; opacity: 0.5; }
    .b1 { fill: #1a7f37; } .b2 { fill: #0969da; } .b3 { fill: #8250df; } .b4 { fill: #bf3989; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
    .h { font-weight: 600; font-size: 12px; fill: #59636e; }
    .lv { font-weight: 600; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .m { font-size: 12px; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .rule { stroke: #8b949e; stroke-width: 0.8; opacity: 0.5; }
      .b1 { fill: #3fb950; } .b2 { fill: #58a6ff; } .b3 { fill: #bc8cff; } .b4 { fill: #f778ba; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 13px; }
      .h { font-weight: 600; font-size: 12px; fill: #9198a1; }
      .m { font-size: 12px; fill: #9198a1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="860" height="330" rx="10"/>

  <text class="h" x="24" y="34">Level</text>
  <text class="h" x="130" y="34">Model (balanced)</text>
  <text class="h" x="300" y="34">Effort</text>
  <text class="h" x="380" y="34">Model strength</text>
  <text class="h" x="580" y="34">Typical subtask</text>
  <line class="rule" x1="20" y1="44" x2="840" y2="44"/>

  <text class="lv" x="24" y="72">lookup</text><text x="130" y="72">Haiku</text><text class="code" x="300" y="72">low</text>
  <rect class="b1" x="380" y="60" width="45" height="16" rx="3"/>
  <text class="m" x="580" y="72">Find, list, summarize, run a command</text>

  <text class="lv" x="24" y="112">standard</text><text x="130" y="112">Sonnet</text><text class="code" x="300" y="112">medium</text>
  <rect class="b2" x="380" y="100" width="90" height="16" rx="3"/>
  <text class="m" x="580" y="112">Implement to a clear spec, write tests</text>

  <text class="lv" x="24" y="152">complex</text><text x="130" y="152">Sonnet</text><text class="code" x="300" y="152">high</text>
  <rect class="b2" x="380" y="140" width="90" height="16" rx="3"/>
  <text class="m" x="580" y="152">Design, review, risky or cross-module</text>

  <text class="lv" x="24" y="192">hardest</text><text x="130" y="192">Opus</text><text class="code" x="300" y="192">high</text>
  <rect class="b3" x="380" y="180" width="135" height="16" rx="3"/>
  <text class="m" x="580" y="192">Ambiguous, multi-system and risky</text>

  <text class="lv" x="24" y="232">frontier</text><text x="130" y="232">Fable</text><text class="code" x="300" y="232">high</text>
  <rect class="b4" x="380" y="220" width="180" height="16" rx="3"/>
  <text class="m" x="580" y="232">No known approach: research</text>

  <line class="rule" x1="20" y1="252" x2="840" y2="252"/>
  <text class="m" x="24" y="278">Priority quality goes one step stronger, fast one step lighter. When the cap, availableModels, deniedModels or failures</text>
  <text class="m" x="24" y="298">rule a model out, the pick moves to the nearest usable model above it, or to the strongest one left.</text>
</svg>
