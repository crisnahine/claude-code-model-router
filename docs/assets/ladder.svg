<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 492" width="920" height="492" role="img" aria-label="With balanced priority, lookup runs on Haiku at medium effort, standard on Sonnet at medium, complex on Opus at high, hardest on Opus at xhigh, and frontier on Fable at high. A call climbs one rung each time it comes back for a redo. Quality priority goes one step stronger, fast one step lighter. When the cap, the availableModels or deniedModels settings, or failures rule a model out, the pick moves to the nearest usable model above it, or to the strongest one left, and a pick weaker than its level needs gets one more effort step, up to xhigh.">
<title>The ladder: five levels to a model and an effort</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.inks{stroke:#0C1524}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}</style>
<rect x="0.5" y="0.5" width="919" height="491" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">The ladder</text><text x="32" y="66" class="mut" font-size="13.5">Balanced priority: the cheapest usable model strong enough for each level.</text><text x="180" y="104" class="mut b" font-size="12">Level</text><text x="300" y="104" class="mut b" font-size="12">Model</text><text x="392" y="104" class="mut b" font-size="12">Effort</text><text x="482" y="104" class="mut b" font-size="12">Model strength</text><text x="590" y="104" class="mut b" font-size="12">Typical subtask</text><path d="M24 114H896" class="ln" stroke-width="1"/><rect x="24" y="232" width="872" height="44" rx="10" class="rtsoft"/><path d="M96 122V390M152 122V390" class="lnm" stroke-width="5" stroke-linecap="round" opacity="0.4"/><path d="M96 366H152" class="r1s" stroke-width="6" stroke-linecap="round"/><text x="180" y="371" class="ink b" font-size="15">lookup</text><circle cx="290" cy="366" r="5" class="r1"/><text x="300" y="371" class="ink" font-size="15">Haiku</text><rect x="392" y="354" width="68" height="24" rx="12" class="faint"/><text x="425.79" y="370.68" class="mono ink" font-size="13" text-anchor="middle">medium</text><rect x="482" y="362" width="18" height="8" rx="4" class="r1"/><rect x="506" y="362" width="18" height="8" rx="4" class="faint"/><rect x="530" y="362" width="18" height="8" rx="4" class="faint"/><rect x="554" y="362" width="18" height="8" rx="4" class="faint"/><text x="590" y="371" class="mut" font-size="12.5">Find, list, summarize, run a command</text><path d="M96 310H152" class="r2s" stroke-width="6" stroke-linecap="round"/><text x="180" y="315" class="ink b" font-size="15">standard</text><circle cx="290" cy="310" r="5" class="r2"/><text x="300" y="315" class="ink" font-size="15">Sonnet</text><rect x="392" y="298" width="68" height="24" rx="12" class="faint"/><text x="425.79" y="314.68" class="mono ink" font-size="13" text-anchor="middle">medium</text><rect x="482" y="306" width="18" height="8" rx="4" class="r2"/><rect x="506" y="306" width="18" height="8" rx="4" class="r2"/><rect x="530" y="306" width="18" height="8" rx="4" class="faint"/><rect x="554" y="306" width="18" height="8" rx="4" class="faint"/><text x="590" y="315" class="mut" font-size="12.5">Implement to a clear spec, write tests</text><path d="M96 254H152" class="r3s" stroke-width="6" stroke-linecap="round"/><text x="180" y="259" class="ink b" font-size="15">complex</text><circle cx="290" cy="254" r="5" class="r3"/><text x="300" y="259" class="ink" font-size="15">Opus</text><rect x="392" y="242" width="52" height="24" rx="12" class="faint"/><text x="417.86" y="258.68" class="mono ink" font-size="13" text-anchor="middle">high</text><rect x="482" y="250" width="18" height="8" rx="4" class="r3"/><rect x="506" y="250" width="18" height="8" rx="4" class="r3"/><rect x="530" y="250" width="18" height="8" rx="4" class="r3"/><rect x="554" y="250" width="18" height="8" rx="4" class="faint"/><text x="590" y="259" class="mut" font-size="12.5">Fix a bug, design, review, risky change</text><path d="M96 198H152" class="r4s" stroke-width="6" stroke-linecap="round"/><text x="180" y="203" class="ink b" font-size="15">hardest</text><circle cx="290" cy="198" r="5" class="r4"/><text x="300" y="203" class="ink" font-size="15">Opus</text><rect x="392" y="186" width="60" height="24" rx="12" class="faint"/><text x="421.825" y="202.68" class="mono ink" font-size="13" text-anchor="middle">xhigh</text><rect x="482" y="194" width="18" height="8" rx="4" class="r4"/><rect x="506" y="194" width="18" height="8" rx="4" class="r4"/><rect x="530" y="194" width="18" height="8" rx="4" class="r4"/><rect x="554" y="194" width="18" height="8" rx="4" class="faint"/><text x="590" y="203" class="mut" font-size="12.5">Ambiguous, multi-system and risky at once</text><path d="M96 142H152" class="r5s" stroke-width="6" stroke-linecap="round"/><text x="180" y="147" class="ink b" font-size="15">frontier</text><circle cx="290" cy="142" r="5" class="r5"/><text x="300" y="147" class="ink" font-size="15">Fable</text><rect x="392" y="130" width="52" height="24" rx="12" class="faint"/><text x="417.86" y="146.68" class="mono ink" font-size="13" text-anchor="middle">high</text><rect x="482" y="138" width="18" height="8" rx="4" class="r5"/><rect x="506" y="138" width="18" height="8" rx="4" class="r5"/><rect x="530" y="138" width="18" height="8" rx="4" class="r5"/><rect x="554" y="138" width="18" height="8" rx="4" class="r5"/><text x="590" y="147" class="mut" font-size="12.5">No known approach: research</text><circle cx="124" cy="254" r="13" class="halo" fill="none" stroke-width="5"/><circle cx="124" cy="254" r="11" class="rt"/><rect x="30" y="242" width="49" height="24" rx="12" class="rt"/><text x="54.64" y="258.32" class="mono tag" font-size="12" text-anchor="middle">redo</text><path class="rts" d="M124 306V272" stroke-width="2.5" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/><text x="32" y="432" class="mut" font-size="13">Priority quality goes one step stronger, fast one step lighter. When the cap, availableModels, deniedModels or failures</text><text x="32" y="452" class="mut" font-size="13">rule a model out, the pick moves to the nearest usable model above it, or to the strongest one left. A redo runs one level higher.</text><text x="32" y="472" class="mut" font-size="13">A pick weaker than its level needs gets one more effort step, up to xhigh, which makes up part of the loss.</text>
</svg>
