<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1588" width="600" height="1588" role="img" aria-label="Stop paying for the wrong model. Four agent calls that would all run on the session&#x27;s model run on Haiku, Sonnet, Opus and Fable instead, the model Claude names for each, at that model&#x27;s effort.">
<title>Model Router: stop paying for the wrong model</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.rail{stroke:#C9D4E4}.tilehalo{stroke:#0C1524}.bg{fill:#0A101B}.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.haloc{stroke:#0A101B}.tile{fill:#13203A;stroke:#2C3E60}.stop0{stop-color:#0F1828}.stop1{stop-color:#0A101B}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}.a1,.a2,.a3,.p1,.p2,.p3,.p4{animation:rise .7s ease-out both}.a1{animation-delay:.05s}.a2{animation-delay:.25s}.a3{animation-delay:.45s}.p1{animation-delay:1.8s}.p2{animation-delay:2s}.p3{animation-delay:2.2s}.p4{animation-delay:2.4s}.won{animation:fade .6s ease-out 1.2s both}@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}@keyframes fade{0%{opacity:0}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="600" height="1588" rx="24" class="bg"/><rect x="0.5" y="0.5" width="599" height="1587" rx="24" fill="none" class="ln" stroke-width="1"/><g transform="translate(32 40) scale(0.75)"><rect x="1" y="1" width="62" height="62" rx="15" class="tile" stroke-width="1.5"/><path d="M21 9V55M43 9V55" class="rail" stroke-width="4.4" stroke-linecap="round" fill="none"/><path d="M21 14H43" class="r5s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 23H43" class="r4s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 32H43" class="r3s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 41H43" class="r2s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 50H43" class="r1s" stroke-width="3.4" stroke-linecap="round"/><path d="M7 41H27A4.5 4.5 0 0 0 31.5 36.5A4.5 4.5 0 0 1 36 32H51" class="tilehalo" stroke-width="10.5" fill="none" stroke-linecap="round"/><path d="M7 41H27A4.5 4.5 0 0 0 31.5 36.5A4.5 4.5 0 0 1 36 32H51" class="rts" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="32" r="4.9" class="rt"/></g><text x="96" y="69.04" class="mono rt b" font-size="14" letter-spacing="1.8">ATTENTION, CLAUDE CODE USERS</text><g class="a1"><text x="30" y="149.4" class="ink b" font-size="46">Stop paying for</text><text x="30" y="200" class="ink b" font-size="46">the wrong model.</text></g><g class="a2"><text x="32" y="251.9" class="mut" font-size="19">A subagent that names no model runs on your</text><text x="32" y="281.35" class="mut" font-size="19">session's model, so easy work pays strong-model</text><text x="32" y="310.8" class="mut" font-size="19">prices. Claude names the model and effort each call</text><text x="32" y="340.25" class="mut" font-size="19">needs, Model Router holds it to your cap, and a call</text><text x="32" y="369.7" class="mut" font-size="19">Claude marks as a redo gets more effort, then a</text><text x="32" y="399.15" class="mut" font-size="19">stronger model.</text><text x="32" y="448.55" class="mono mut b" font-size="12" letter-spacing="1.4">API LIST PRICE, PER MILLION INPUT TOKENS</text><circle cx="37" cy="474.65" r="5" class="r1"/><text x="48" y="480.05" font-size="15"><tspan class="ink b">Haiku</tspan><tspan class="mono mut" dx="7.5">$0.10</tspan></text><circle cx="170.75" cy="474.65" r="5" class="r2"/><text x="181.75" y="480.05" font-size="15"><tspan class="ink b">Sonnet</tspan><tspan class="mono mut" dx="7.5">$2</tspan></text><circle cx="285.75" cy="474.65" r="5" class="r3"/><text x="296.75" y="480.05" font-size="15"><tspan class="ink b">Opus</tspan><tspan class="mono mut" dx="7.5">$4</tspan></text><circle cx="383.35" cy="474.65" r="5" class="r5"/><text x="394.35" y="480.05" font-size="15"><tspan class="ink b">Fable</tspan><tspan class="mono mut" dx="7.5">$8</tspan></text></g><g class="a3"><rect x="32" y="520.05" width="536" height="494" rx="18" class="card" stroke-width="1"/><text x="56" y="558.05" class="ink b" font-size="15">Four agent calls</text><text x="56" y="594.05" class="mono mut b" font-size="11.5" letter-spacing="1.4">WITHOUT MODEL ROUTER</text><circle cx="62" cy="618.55" r="5.5" class="mut"/><text x="76" y="624.05" class="mut" font-size="15">All four run on your session's model.</text><g class="won"><rect x="42" y="648.05" width="516" height="310" rx="14" class="rtsoft"/><text x="56" y="678.05" class="mono rt b" font-size="11.5" letter-spacing="1.4">WITH MODEL ROUTER</text><text x="56" y="709.05" class="mono ink" font-size="12.5">"List the files under src"</text><circle cx="62" cy="735.55" r="5.5" class="r1"/><text x="76" y="742.05" class="ink b" font-size="18">Haiku</text><rect x="144.2" y="723.55" width="68" height="26" rx="13" class="faint"/><text x="178.075" y="741.05" class="mono ink" font-size="12.5" text-anchor="middle">lookup</text><rect x="219.95" y="723.55" width="68" height="26" rx="13" class="faint"/><text x="253.825" y="741.05" class="mono ink" font-size="12.5" text-anchor="middle">medium</text><text x="56" y="773.05" class="mono ink" font-size="12.5">"Write tests for the slugify helper"</text><circle cx="62" cy="799.55" r="5.5" class="r2"/><text x="76" y="806.05" class="ink b" font-size="18">Sonnet</text><rect x="154.64" y="787.55" width="83" height="26" rx="13" class="faint"/><text x="196.14" y="805.05" class="mono ink" font-size="12.5" text-anchor="middle">standard</text><rect x="245.64" y="787.55" width="68" height="26" rx="13" class="faint"/><text x="279.515" y="805.05" class="mono ink" font-size="12.5" text-anchor="middle">medium</text><text x="56" y="837.05" class="mono ink" font-size="12.5">"Review the auth change for security holes"</text><circle cx="62" cy="863.55" r="5.5" class="r3"/><text x="76" y="870.05" class="ink b" font-size="18">Opus</text><rect x="133.76" y="851.55" width="75" height="26" rx="13" class="faint"/><text x="171.447" y="869.05" class="mono ink" font-size="12.5" text-anchor="middle">complex</text><rect x="217.135" y="851.55" width="52" height="26" rx="13" class="faint"/><text x="243.385" y="869.05" class="mono ink" font-size="12.5" text-anchor="middle">high</text><text x="56" y="901.05" class="mono ink" font-size="12.5">"Investigate open-ended data loss across services"</text><circle cx="62" cy="927.55" r="5.5" class="r5"/><text x="76" y="934.05" class="ink b" font-size="18">Fable</text><rect x="144.2" y="915.55" width="83" height="26" rx="13" class="faint"/><text x="185.7" y="933.05" class="mono ink" font-size="12.5" text-anchor="middle">frontier</text><rect x="235.2" y="915.55" width="52" height="26" rx="13" class="faint"/><text x="261.45" y="933.05" class="mono ink" font-size="12.5" text-anchor="middle">high</text></g><text x="56" y="992.05" class="mut" font-size="14">A redo Claude marks gets more effort first.</text></g><path d="M32 1066.05H568" class="ln" stroke-width="1"/><text x="32" y="1106.05" class="mono rt b" font-size="13" letter-spacing="1.8">BUILT BY THE BOOK</text><g class="p1"><g transform="translate(32 1136.05)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="1154.05" class="ink b" font-size="17">Follows Claude's best practices</text><text x="72" y="1181.05" class="mut" font-size="14.5">Haiku for simple work, as Claude Code's best practices advise,</text><text x="72" y="1203.05" class="mut" font-size="14.5">so a strong model does only the work that needs it.</text></g><g class="p2"><g transform="translate(32 1239.05)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="1257.05" class="ink b" font-size="17">Effort before model</text><text x="72" y="1284.05" class="mut" font-size="14.5">A call Claude marks as a redo runs one effort step higher</text><text x="72" y="1306.05" class="mut" font-size="14.5">first, and moves to a stronger model once it ran at high.</text></g><g class="p3"><g transform="translate(32 1342.05)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="1360.05" class="ink b" font-size="17">Built on the Claude Code docs</text><text x="72" y="1387.05" class="mut" font-size="14.5">Documented hooks, mods and settings only, checked against the</text><text x="72" y="1409.05" class="mut" font-size="14.5">changelog every day. Every hook fails open.</text></g><g class="p4"><g transform="translate(32 1445.05)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="1463.05" class="ink b" font-size="17">Your choices come first</text><text x="72" y="1490.05" class="mut" font-size="14.5">A model you name, an agent's own model and</text><text x="72" y="1512.05" class="mut" font-size="14.5">CLAUDE_CODE_SUBAGENT_MODEL stay, inside your max_tier, until</text><text x="72" y="1534.05" class="mut" font-size="14.5">Claude marks a redo.</text></g>
</svg>
