<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" role="img" aria-label="Stop paying for the wrong model. Four agent calls that would all run on the session&#x27;s model run on Haiku, Sonnet, Opus and Fable instead, the model Claude names for each, at that model&#x27;s effort.">
<title>Model Router: stop paying for the wrong model</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.rail{stroke:#C9D4E4}.tilehalo{stroke:#0C1524}.bg{fill:#0A101B}.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.haloc{stroke:#0A101B}.tile{fill:#13203A;stroke:#2C3E60}.stop0{stop-color:#0F1828}.stop1{stop-color:#0A101B}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}.a1,.a2,.a3,.p1,.p2,.p3,.p4{animation:rise .7s ease-out both}.a1{animation-delay:.05s}.a2{animation-delay:.25s}.a3{animation-delay:.45s}.p1{animation-delay:1.8s}.p2{animation-delay:2s}.p3{animation-delay:2.2s}.p4{animation-delay:2.4s}.won{animation:fade .6s ease-out 1.2s both}@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}@keyframes fade{0%{opacity:0}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="910" rx="24" class="bg"/><rect x="0.5" y="0.5" width="1199" height="909" rx="24" fill="none" class="ln" stroke-width="1"/><g transform="translate(64 48) scale(0.8)"><rect x="1" y="1" width="62" height="62" rx="15" class="tile" stroke-width="1.5"/><path d="M21 9V55M43 9V55" class="rail" stroke-width="4.4" stroke-linecap="round" fill="none"/><path d="M21 14H43" class="r5s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 23H43" class="r4s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 32H43" class="r3s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 41H43" class="r2s" stroke-width="3.4" stroke-linecap="round"/><path d="M21 50H43" class="r1s" stroke-width="3.4" stroke-linecap="round"/><path d="M7 41H27A4.5 4.5 0 0 0 31.5 36.5A4.5 4.5 0 0 1 36 32H51" class="tilehalo" stroke-width="10.5" fill="none" stroke-linecap="round"/><path d="M7 41H27A4.5 4.5 0 0 0 31.5 36.5A4.5 4.5 0 0 1 36 32H51" class="rts" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="32" r="4.9" class="rt"/></g><text x="131.2" y="79" class="mono rt b" font-size="15" letter-spacing="1.8">ATTENTION, CLAUDE CODE USERS</text><g class="a1"><text x="62" y="169.6" class="ink b" font-size="56">Stop paying for</text><text x="62" y="231.2" class="ink b" font-size="56">the wrong model.</text></g><g class="a2"><text x="64" y="290" class="mut" font-size="20">A subagent that names no model runs on your session's</text><text x="64" y="321" class="mut" font-size="20">model, so easy work pays strong-model prices. Claude</text><text x="64" y="352" class="mut" font-size="20">names the model and effort each call needs, Model</text><text x="64" y="383" class="mut" font-size="20">Router holds it to your cap, and a call Claude marks</text><text x="64" y="414" class="mut" font-size="20">as a redo gets more effort, then a stronger model.</text><text x="64" y="466" class="mono mut b" font-size="13" letter-spacing="1.4">API LIST PRICE, PER MILLION INPUT TOKENS</text><circle cx="69" cy="495.58" r="5" class="r1"/><text x="80" y="501.7" font-size="17"><tspan class="ink b">Haiku</tspan><tspan class="mono mut" dx="8.5">$0.10</tspan></text><circle cx="218.45" cy="495.58" r="5" class="r2"/><text x="229.45" y="501.7" font-size="17"><tspan class="ink b">Sonnet</tspan><tspan class="mono mut" dx="8.5">$2</tspan></text><circle cx="346.65" cy="495.58" r="5" class="r3"/><text x="357.65" y="501.7" font-size="17"><tspan class="ink b">Opus</tspan><tspan class="mono mut" dx="8.5">$4</tspan></text><circle cx="455.13" cy="495.58" r="5" class="r5"/><text x="466.13" y="501.7" font-size="17"><tspan class="ink b">Fable</tspan><tspan class="mono mut" dx="8.5">$8</tspan></text></g><g class="a3"><rect x="680" y="48" width="456" height="494" rx="18" class="card" stroke-width="1"/><text x="704" y="86" class="ink b" font-size="15">Four agent calls</text><text x="704" y="122" class="mono mut b" font-size="11.5" letter-spacing="1.4">WITHOUT MODEL ROUTER</text><circle cx="710" cy="146.5" r="5.5" class="mut"/><text x="724" y="152" class="mut" font-size="15">All four run on your session's model.</text><g class="won"><rect x="690" y="176" width="436" height="310" rx="14" class="rtsoft"/><text x="704" y="206" class="mono rt b" font-size="11.5" letter-spacing="1.4">WITH MODEL ROUTER</text><text x="704" y="237" class="mono ink" font-size="12.5">"List the files under src"</text><circle cx="710" cy="263.5" r="5.5" class="r1"/><text x="724" y="270" class="ink b" font-size="18">Haiku</text><rect x="792.2" y="251.5" width="68" height="26" rx="13" class="faint"/><text x="826.075" y="269" class="mono ink" font-size="12.5" text-anchor="middle">lookup</text><rect x="867.95" y="251.5" width="68" height="26" rx="13" class="faint"/><text x="901.825" y="269" class="mono ink" font-size="12.5" text-anchor="middle">medium</text><text x="704" y="301" class="mono ink" font-size="12.5">"Write tests for the slugify helper"</text><circle cx="710" cy="327.5" r="5.5" class="r2"/><text x="724" y="334" class="ink b" font-size="18">Sonnet</text><rect x="802.64" y="315.5" width="83" height="26" rx="13" class="faint"/><text x="844.14" y="333" class="mono ink" font-size="12.5" text-anchor="middle">standard</text><rect x="893.64" y="315.5" width="68" height="26" rx="13" class="faint"/><text x="927.515" y="333" class="mono ink" font-size="12.5" text-anchor="middle">medium</text><text x="704" y="365" class="mono ink" font-size="12.5">"Review the auth change for security holes"</text><circle cx="710" cy="391.5" r="5.5" class="r3"/><text x="724" y="398" class="ink b" font-size="18">Opus</text><rect x="781.76" y="379.5" width="75" height="26" rx="13" class="faint"/><text x="819.447" y="397" class="mono ink" font-size="12.5" text-anchor="middle">complex</text><rect x="865.135" y="379.5" width="52" height="26" rx="13" class="faint"/><text x="891.385" y="397" class="mono ink" font-size="12.5" text-anchor="middle">high</text><text x="704" y="429" class="mono ink" font-size="12.5">"Investigate open-ended data loss across services"</text><circle cx="710" cy="455.5" r="5.5" class="r5"/><text x="724" y="462" class="ink b" font-size="18">Fable</text><rect x="792.2" y="443.5" width="83" height="26" rx="13" class="faint"/><text x="833.7" y="461" class="mono ink" font-size="12.5" text-anchor="middle">frontier</text><rect x="883.2" y="443.5" width="52" height="26" rx="13" class="faint"/><text x="909.45" y="461" class="mono ink" font-size="12.5" text-anchor="middle">high</text></g><text x="704" y="520" class="mut" font-size="14">A redo Claude marks gets more effort first.</text></g><path d="M64 594H1136" class="ln" stroke-width="1"/><text x="64" y="634" class="mono rt b" font-size="13" letter-spacing="1.8">BUILT BY THE BOOK</text><g class="p1"><g transform="translate(64 664)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="104" y="682" class="ink b" font-size="17">Follows Claude's best practices</text><text x="104" y="709" class="mut" font-size="14.5">Haiku for simple work, as Claude Code's best practices</text><text x="104" y="731" class="mut" font-size="14.5">advise, so a strong model does only the work that needs it.</text></g><g class="p2"><g transform="translate(624 664)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="664" y="682" class="ink b" font-size="17">Effort before model</text><text x="664" y="709" class="mut" font-size="14.5">A call Claude marks as a redo runs one effort step higher</text><text x="664" y="731" class="mut" font-size="14.5">first, and moves to a stronger model once it ran at high.</text></g><g class="p3"><g transform="translate(64 767)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="104" y="785" class="ink b" font-size="17">Built on the Claude Code docs</text><text x="104" y="812" class="mut" font-size="14.5">Documented hooks, mods and settings only, checked against</text><text x="104" y="834" class="mut" font-size="14.5">the changelog every day. Every hook fails open.</text></g><g class="p4"><g transform="translate(624 767)"><circle cx="12" cy="12" r="12" class="faint"/><path d="M7.2 12.4l3.2 3.2 6.4-6.8" fill="none" class="inks" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="664" y="785" class="ink b" font-size="17">Your choices come first</text><text x="664" y="812" class="mut" font-size="14.5">A model you name, an agent's own model and</text><text x="664" y="834" class="mut" font-size="14.5">CLAUDE_CODE_SUBAGENT_MODEL stay, inside your max_tier, until</text><text x="664" y="856" class="mut" font-size="14.5">Claude marks a redo.</text></g>
</svg>
