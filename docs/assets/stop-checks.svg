<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 486" width="920" height="486" role="img" aria-label="When Claude is about to end a turn, the Stop hook runs two checks. strong_agent_gate, on by default, blocks the stop once when a complex or harder request was answered by a weaker session model with no agent of the needed strength started, and asks for a stronger agent&#x27;s check, started no lower than the request&#x27;s level. verify_gate, on by default, asks once for a test run when code changed and nothing checked it.">
<title>The checks before a turn ends: strong_agent_gate and verify_gate</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.rail{stroke:#C9D4E4}.tilehalo{stroke:#0C1524}.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.inks{stroke:#0C1524}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.haloc{stroke:#F4F7FB}.tile{fill:#0C1524;stroke:#0C1524}.stop0{stop-color:#FFFFFF}.stop1{stop-color:#F4F7FB}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.bg{fill:#0A101B}.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.haloc{stroke:#0A101B}.tile{fill:#13203A;stroke:#2C3E60}.stop0{stop-color:#0F1828}.stop1{stop-color:#0A101B}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}.sa{opacity:0;animation:sa 5s linear infinite}@keyframes sa{0%{transform:translate(400px,138px);opacity:0}8%{transform:translate(400px,138px);opacity:1}18%{transform:translate(400px,156px);opacity:1}28%{transform:translate(237px,156px);opacity:1}38%{transform:translate(237px,182px);opacity:1}44%{transform:translate(237px,182px);opacity:0}100%{transform:translate(237px,182px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="919" height="485" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">The checks before a turn ends</text><text x="32" y="66" class="mut" font-size="13.5">The Stop hook runs two checks. Each asks once, then lets the turn end.</text><rect x="320" y="88" width="280" height="50" rx="25" class="card" stroke-width="1"/><text x="460" y="118" class="ink b" font-size="13.5" text-anchor="middle">Claude is about to end the turn</text><path d="M400 138V156H237V176M232 171L237 176L242 171" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 138V156H683V176M678 171L683 176L688 171" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g opacity="1.0"><rect x="32" y="182" width="410" height="252" rx="12" class="card" stroke-width="1"/><text x="52" y="212" class="mono ink b" font-size="14">strong_agent_gate</text><rect x="203.18" y="194" width="111" height="24" rx="12" class="r1"/><text x="258.778" y="210.14" class="mono tag" font-size="11.5" text-anchor="middle">on by default</text><text x="52" y="244" class="mut b" font-size="12">Asks when</text><text x="52" y="266" class="ink" font-size="13">the request is complex or harder,</text><text x="52" y="286" class="ink" font-size="13">the session model is weaker than it needs,</text><text x="52" y="306" class="ink" font-size="13">and no agent of the needed strength started.</text><path d="M52 336H422" class="ln" stroke-width="1"/><text x="52" y="360" class="mut b" font-size="12">Then</text><text x="94" y="360" class="ink" font-size="13">Blocks the stop once and asks for a stronger</text><text x="94" y="379" class="ink" font-size="13">agent's check: the architect, or the deep-solver</text><text x="94" y="398" class="ink" font-size="13">for a frontier request, started no lower than</text><text x="94" y="417" class="ink" font-size="13">the request's level.</text></g><g opacity="1.0"><rect x="478" y="182" width="410" height="252" rx="12" class="card" stroke-width="1"/><text x="498" y="212" class="mono ink b" font-size="14">verify_gate</text><rect x="597.94" y="194" width="111" height="24" rx="12" class="r1"/><text x="653.538" y="210.14" class="mono tag" font-size="11.5" text-anchor="middle">on by default</text><text x="498" y="244" class="mut b" font-size="12">Asks when</text><text x="498" y="266" class="ink" font-size="13">code in the project changed, and no test, lint,</text><text x="498" y="286" class="ink" font-size="13">type-check or build ran after the last edit,</text><text x="498" y="306" class="ink" font-size="13">and no verifier or reviewer started.</text><path d="M498 336H868" class="ln" stroke-width="1"/><text x="498" y="360" class="mut b" font-size="12">Then</text><text x="540" y="360" class="ink" font-size="13">Asks once for a test run (the verifier)</text><text x="540" y="379" class="ink" font-size="13">before the turn ends. It is the failure signal</text><text x="540" y="398" class="ink" font-size="13">the router reruns on. Turn it off in /config.</text></g><text x="32" y="464" class="mut" font-size="13">Both are options in /config. The stronger-agent hand-off starts at the request's level, so a short hand-off brief can't route it lower.</text><circle cx="0" cy="0" r="6" class="rt sa"/>
</svg>
