<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 486" width="920" height="486" role="img" aria-label="When Claude is about to end a turn, the Stop hook runs one check. verify_gate, on by default, asks once for the work&#x27;s own check when project files changed and nothing checked them.">
<title>The check before a turn ends: verify_gate</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}</style>
<rect x="0.5" y="0.5" width="919" height="485" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">The check before a turn ends</text><text x="32" y="66" class="mut" font-size="13.5">The Stop hook runs one check. It asks once, then lets the turn end.</text><rect x="320" y="88" width="280" height="50" rx="25" class="card" stroke-width="1"/><text x="460" y="118" class="ink b" font-size="13.5" text-anchor="middle">Claude is about to end the turn</text><path d="M460 138V176M455 171L460 176L465 171" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="255" y="182" width="410" height="252" rx="12" class="card" stroke-width="1"/><text x="275" y="212" class="mono ink b" font-size="14">verify_gate</text><rect x="374.94" y="194" width="111" height="24" rx="12" class="r1"/><text x="430.538" y="210.14" class="mono tag" font-size="11.5" text-anchor="middle">on by default</text><text x="275" y="244" class="mut b" font-size="12">Asks when</text><text x="275" y="266" class="ink" font-size="13">a file in the project was edited, and no</text><text x="275" y="286" class="ink" font-size="13">check command ran after the last edit, and</text><text x="275" y="306" class="ink" font-size="13">the transcript can be read.</text><path d="M275 336H645" class="ln" stroke-width="1"/><text x="275" y="360" class="mut b" font-size="12">Then</text><text x="317" y="360" class="ink" font-size="13">Asks once for the work's own check: tests</text><text x="317" y="379" class="ink" font-size="13">for code, a recompute for figures, a reread</text><text x="317" y="398" class="ink" font-size="13">for a document. Turn it off in /config.</text><text x="32" y="464" class="mut" font-size="13">Any background task still running, such as a subagent, shell or monitor, holds the check, since the turn is paused, not done.</text>
</svg>
