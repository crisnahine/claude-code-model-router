<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 336" width="920" height="336" role="img" aria-label="A call is routed at its level, for example standard on Sonnet at medium effort. Its result comes back and the call is recorded as finished. When Claude starts a call&#x27;s description with &quot;Redo:&quot;, the call runs one level higher, complex on Opus at high.">
<title>Redo escalation: a call marked as a redo runs one level higher</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.inks{stroke:#0C1524}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}</style>
<rect x="0.5" y="0.5" width="919" height="335" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">Redo escalation</text><text x="32" y="66" class="mut" font-size="13.5">A call whose description starts with "Redo:" runs one level higher.</text><rect x="32" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="33" y="106" width="4" height="76" rx="2" class="r2"/><text x="50" y="122" class="ink b" font-size="14.5">1. Agent call</text><text x="50" y="146" class="mut" font-size="13">Routed at its level:</text><text x="50" y="165" class="mono ink" font-size="12">standard, Sonnet, medium</text><path d="M234 144H250M245 139L250 144L245 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="256" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="257" y="106" width="4" height="76" rx="2" class="faint"/><text x="274" y="122" class="ink b" font-size="14.5">2. Result comes back</text><text x="274" y="146" class="mut" font-size="13">Recorded as finished,</text><text x="274" y="165" class="mut" font-size="13">with the level it ran at.</text><path d="M458 144H474M469 139L474 144L469 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="481" y="106" width="4" height="76" rx="2" class="rt"/><text x="498" y="122" class="ink b" font-size="14.5">3. Marked as a redo</text><text x="498" y="146" class="mut" font-size="13">Its description starts</text><text x="498" y="165" class="mut" font-size="13">with "Redo:".</text><path d="M682 144H698M693 139L698 144L693 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="704" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="705" y="106" width="4" height="76" rx="2" class="r3"/><text x="722" y="122" class="ink b" font-size="14.5">4. One level higher</text><text x="722" y="146" class="mut" font-size="13">Up a model, or up effort:</text><text x="722" y="165" class="mono ink" font-size="12">complex, Opus, high</text><path d="M130.0 218H802.0" class="ln" stroke-width="3" stroke-linecap="round"/><circle cx="130.0" cy="218" r="5" class="faint"/><circle cx="354.0" cy="218" r="5" class="faint"/><circle cx="578.0" cy="218" r="5" class="faint"/><circle cx="802.0" cy="218" r="5" class="faint"/><circle cx="802.0" cy="218" r="11" class="halo" fill="none" stroke-width="5"/><circle cx="802.0" cy="218" r="9" class="rt"/><text x="32" y="264" class="mut" font-size="13">One level up the ladder: lookup, standard and hardest move to a stronger model; complex stays on Opus</text><text x="32" y="284" class="mut" font-size="13">at more effort, and a frontier redo runs at one step more effort. Not a redo: copies of one brief started</text><text x="32" y="304" class="mut" font-size="13">together. Never escalated: a call that names its own model. A background agent's call counts as finished</text><text x="32" y="324" class="mut" font-size="13">when the agent stops with an answer.</text>
</svg>
