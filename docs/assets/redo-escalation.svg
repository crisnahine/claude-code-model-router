<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
  <title id="title">Redo escalation: the same call again runs one level higher</title>
  <desc id="desc">A call is routed at its level, for example standard on Sonnet at medium effort. Its result comes back and the call is recorded as finished. If Claude issues the same call again, it runs one level higher, complex on Sonnet at high, and counts as a vote that standard was routed too low. At least 6 votes, and at least 30 percent of a level's calls, raise that level one step.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .first { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .redo { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .arrow { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .head { fill: #57606a; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .m { font-size: 12px; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #8b949e; stroke-width: 1.2; }
      .first { fill: #0f2e1a; stroke: #3fb950; stroke-width: 1.5; }
      .redo { fill: #2b1a4a; stroke: #bc8cff; stroke-width: 1.5; }
      .arrow { stroke: #8b949e; stroke-width: 1.6; fill: none; marker-end: url(#head); }
      .head { fill: #8b949e; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .m { font-size: 12px; fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="300" rx="10"/>

  <rect class="first" x="20" y="24" width="190" height="86" rx="8"/>
  <text class="h" x="36" y="50">1. Agent call</text>
  <text class="s" x="36" y="72">Routed at its level:</text>
  <text class="s" x="36" y="92">standard, Sonnet, medium</text>

  <path class="arrow" d="M210,67 L238,67"/>
  <rect class="panel" x="240" y="24" width="190" height="86" rx="8"/>
  <text class="h" x="256" y="50">2. Result comes back</text>
  <text class="s" x="256" y="72">The call is recorded as</text>
  <text class="s" x="256" y="92">finished, with its level.</text>

  <path class="arrow" d="M430,67 L458,67"/>
  <rect class="panel" x="460" y="24" width="160" height="86" rx="8"/>
  <text class="h" x="476" y="50">3. Same call again</text>
  <text class="s" x="476" y="72">In the same request:</text>
  <text class="s" x="476" y="92">the answer fell short.</text>

  <path class="arrow" d="M620,67 L648,67"/>
  <rect class="redo" x="650" y="24" width="190" height="86" rx="8"/>
  <text class="h" x="666" y="50">4. One level higher</text>
  <text class="s" x="666" y="72">complex, Sonnet, high</text>
  <text class="s" x="666" y="92">up a model, or up effort</text>

  <path class="arrow" d="M745,110 L745,150"/>
  <rect class="panel" x="430" y="152" width="410" height="64" rx="8"/>
  <text class="h" x="446" y="176">A vote that standard was routed too low</text>
  <text class="s" x="446" y="198">At least 6 votes and 30% of its calls raise the level one step.</text>

  <text class="m" x="24" y="160">One level up the ladder: lookup, complex and hardest</text>
  <text class="m" x="24" y="180">move to a stronger model; standard stays on Sonnet at high.</text>
  <text class="m" x="24" y="200">A frontier redo runs at one step more effort.</text>
  <text class="m" x="24" y="244">Not a redo: copies of one brief started together. Never escalated: a call that names its own model.</text>
  <text class="m" x="24" y="264">A background agent's call counts as finished when the agent stops with an answer.</text>
</svg>
