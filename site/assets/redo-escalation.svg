<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" role="img" aria-label="A call is routed at its level, for example standard on Sonnet at medium effort. Its result comes back and the call is recorded as finished. If Claude issues the same call again in the same request, it runs one level higher, complex on Sonnet at high, and counts as a vote that standard was routed too low. At least 6 votes that are also at least 30 percent of a level&#x27;s calls raise that level one step.">
<title>Redo escalation: the same call again runs one level higher</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.rail{stroke:#C9D4E4}.tilehalo{stroke:#0C1524}.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.inks{stroke:#0C1524}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.haloc{stroke:#F4F7FB}.tile{fill:#0C1524;stroke:#0C1524}.stop0{stop-color:#FFFFFF}.stop1{stop-color:#F4F7FB}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.bg{fill:#0A101B}.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.haloc{stroke:#0A101B}.tile{fill:#13203A;stroke:#2C3E60}.stop0{stop-color:#0F1828}.stop1{stop-color:#0A101B}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}.rtok{animation:rt 9s ease-in-out infinite}@keyframes rt{0%{transform:translate(-672px,0px);opacity:0}4%{transform:translate(-672px,0px);opacity:1}14%{transform:translate(-672px,0px)}22%{transform:translate(-448px,0px)}32%{transform:translate(-448px,0px)}40%{transform:translate(-224px,0px)}50%{transform:translate(-224px,0px)}58%{transform:translate(0px,0px)}92%{transform:translate(0px,0px);opacity:1}100%{transform:translate(0px,0px);opacity:0}}.v0{animation:v0 9s linear infinite}@keyframes v0{0%{opacity:0}58%{opacity:0}59%{opacity:1}96%{opacity:1}100%{opacity:0}}.v1{animation:v1 9s linear infinite}@keyframes v1{0%{opacity:0}63%{opacity:0}64%{opacity:1}96%{opacity:1}100%{opacity:0}}.v2{animation:v2 9s linear infinite}@keyframes v2{0%{opacity:0}68%{opacity:0}69%{opacity:1}96%{opacity:1}100%{opacity:0}}.v3{animation:v3 9s linear infinite}@keyframes v3{0%{opacity:0}73%{opacity:0}74%{opacity:1}96%{opacity:1}100%{opacity:0}}.v4{animation:v4 9s linear infinite}@keyframes v4{0%{opacity:0}78%{opacity:0}79%{opacity:1}96%{opacity:1}100%{opacity:0}}.v5{animation:v5 9s linear infinite}@keyframes v5{0%{opacity:0}83%{opacity:0}84%{opacity:1}96%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="919" height="449" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">Redo escalation</text><text x="32" y="66" class="mut" font-size="13.5">The same call, issued again in the same request after its result came back.</text><rect x="32" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="33" y="106" width="4" height="76" rx="2" class="r2"/><text x="50" y="122" class="ink b" font-size="14.5">1. Agent call</text><text x="50" y="146" class="mut" font-size="13">Routed at its level:</text><text x="50" y="165" class="mono ink" font-size="12">standard, Sonnet, medium</text><path d="M234 144H250M245 139L250 144L245 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="256" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="257" y="106" width="4" height="76" rx="2" class="faint"/><text x="274" y="122" class="ink b" font-size="14.5">2. Result comes back</text><text x="274" y="146" class="mut" font-size="13">Recorded as finished,</text><text x="274" y="165" class="mut" font-size="13">with the level it ran at.</text><path d="M458 144H474M469 139L474 144L469 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="481" y="106" width="4" height="76" rx="2" class="rt"/><text x="498" y="122" class="ink b" font-size="14.5">3. Same call again</text><text x="498" y="146" class="mut" font-size="13">In the same request:</text><text x="498" y="165" class="mut" font-size="13">the answer fell short.</text><path d="M682 144H698M693 139L698 144L693 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="704" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="705" y="106" width="4" height="76" rx="2" class="r3"/><text x="722" y="122" class="ink b" font-size="14.5">4. One level higher</text><text x="722" y="146" class="mut" font-size="13">Up a model, or up effort:</text><text x="722" y="165" class="mono ink" font-size="12">complex, Sonnet, high</text><path d="M130.0 218H802.0" class="ln" stroke-width="3" stroke-linecap="round"/><circle cx="130.0" cy="218" r="5" class="faint"/><circle cx="354.0" cy="218" r="5" class="faint"/><circle cx="578.0" cy="218" r="5" class="faint"/><circle cx="802.0" cy="218" r="5" class="faint"/><g class="rtok"><circle cx="802.0" cy="218" r="11" class="halo" fill="none" stroke-width="5"/><circle cx="802.0" cy="218" r="9" class="rt"/></g><rect x="32" y="256" width="856" height="92" rx="12" class="card" stroke-width="1"/><text x="56" y="288" class="ink b" font-size="14.5">Each redo is a vote that the first level was routed too low</text><circle cx="66" cy="318" r="10" class="faint"/><circle cx="66" cy="318" r="10" class="r2 v0"/><circle cx="96" cy="318" r="10" class="faint"/><circle cx="96" cy="318" r="10" class="r2 v1"/><circle cx="126" cy="318" r="10" class="faint"/><circle cx="126" cy="318" r="10" class="r2 v2"/><circle cx="156" cy="318" r="10" class="faint"/><circle cx="156" cy="318" r="10" class="r2 v3"/><circle cx="186" cy="318" r="10" class="faint"/><circle cx="186" cy="318" r="10" class="r2 v4"/><circle cx="216" cy="318" r="10" class="faint"/><circle cx="216" cy="318" r="10" class="r2 v5"/><text x="262" y="314" class="ink" font-size="13">At least 6 votes that are also at least 30% of the level's calls raise it one step.</text><text x="262" y="334" class="mut" font-size="13">A raise that keeps being overruled with a weaker model is undone the same way.</text><text x="32" y="378" class="mut" font-size="13">One level up the ladder: lookup, complex and hardest move to a stronger model; standard stays on Sonnet</text><text x="32" y="398" class="mut" font-size="13">at more effort, and a frontier redo runs at one step more effort. Not a redo: copies of one brief started</text><text x="32" y="418" class="mut" font-size="13">together. Never escalated: a call that names its own model. A background agent's call counts as finished</text><text x="32" y="438" class="mut" font-size="13">when the agent stops with an answer.</text>
</svg>
