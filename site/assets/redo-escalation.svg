<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 336" width="920" height="336" role="img" aria-label="A call runs at its level, for example standard on Sonnet at medium effort. When its result falls short, Claude marks a redo by starting the call&#x27;s description with Redo. Below high effort, the redo runs the same model one effort step up, Sonnet at high. From high, the next redo runs the next stronger model at its own level&#x27;s effort, complex on Opus at high.">
<title>Redo escalation: effort first, then the model</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.rail{stroke:#C9D4E4}.tilehalo{stroke:#0C1524}.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D2DBE7}.ink{fill:#0C1524}.mut{fill:#4A5871}.faint{fill:#E7EDF5}.ln{stroke:#D2DBE7}.lnm{stroke:#4A5871}.inks{stroke:#0C1524}.rt{fill:#A65200}.rts{stroke:#A65200}.rtsoft{fill:#FFF1DE}.halo{stroke:#FFFFFF}.haloc{stroke:#F4F7FB}.tile{fill:#0C1524;stroke:#0C1524}.stop0{stop-color:#FFFFFF}.stop1{stop-color:#F4F7FB}.tag{fill:#FFFFFF}.r1{fill:#0E8C6F}.r1s{stroke:#0E8C6F}.r2{fill:#0A78B8}.r2s{stroke:#0A78B8}.r3{fill:#3B57D6}.r3s{stroke:#3B57D6}.r4{fill:#6D3FD1}.r4s{stroke:#6D3FD1}.r5{fill:#A72C8A}.r5s{stroke:#A72C8A}@media (prefers-color-scheme: dark){.bg{fill:#0A101B}.card{fill:#0F1828;stroke:#26344B}.ink{fill:#E7EDF6}.mut{fill:#9BA9BD}.faint{fill:#1A263A}.ln{stroke:#26344B}.lnm{stroke:#9BA9BD}.inks{stroke:#E7EDF6}.rt{fill:#FFB23E}.rts{stroke:#FFB23E}.rtsoft{fill:#33260F}.halo{stroke:#0F1828}.haloc{stroke:#0A101B}.tile{fill:#13203A;stroke:#2C3E60}.stop0{stop-color:#0F1828}.stop1{stop-color:#0A101B}.tag{fill:#0C1524}.r1{fill:#38D3A8}.r1s{stroke:#38D3A8}.r2{fill:#45B4F2}.r2s{stroke:#45B4F2}.r3{fill:#8196FF}.r3s{stroke:#8196FF}.r4{fill:#AA8BFF}.r4s{stroke:#AA8BFF}.r5{fill:#F27BCD}.r5s{stroke:#F27BCD}}.rtok{animation:rt 9s ease-in-out infinite}@keyframes rt{0%{transform:translate(-672px,0px);opacity:0}4%{transform:translate(-672px,0px);opacity:1}14%{transform:translate(-672px,0px)}22%{transform:translate(-448px,0px)}32%{transform:translate(-448px,0px)}40%{transform:translate(-224px,0px)}50%{transform:translate(-224px,0px)}58%{transform:translate(0px,0px)}92%{transform:translate(0px,0px);opacity:1}100%{transform:translate(0px,0px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="919" height="335" rx="16" class="card"/><text x="32" y="42" class="ink b" font-size="17">Redo escalation</text><text x="32" y="66" class="mut" font-size="13.5">A call Claude marks as a redo climbs from the run it redoes.</text><rect x="32" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="33" y="106" width="4" height="76" rx="2" class="r2"/><text x="50" y="122" class="ink b" font-size="14.5">1. Agent call</text><text x="50" y="146" class="mut" font-size="13">Runs at its level:</text><text x="50" y="165" class="mono ink" font-size="12">standard, Sonnet, medium</text><path d="M234 144H250M245 139L250 144L245 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="256" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="257" y="106" width="4" height="76" rx="2" class="rt"/><text x="274" y="122" class="ink b" font-size="14.5">2. Claude marks it</text><text x="274" y="146" class="mut" font-size="13">The result fell short:</text><text x="274" y="165" class="mut" font-size="13">description "Redo: ..."</text><path d="M458 144H474M469 139L474 144L469 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="481" y="106" width="4" height="76" rx="2" class="r2"/><text x="498" y="122" class="ink b" font-size="14.5">3. Effort first</text><text x="498" y="146" class="mut" font-size="13">Below high, the same</text><text x="498" y="165" class="mut" font-size="13">model, one step up:</text><text x="498" y="184" class="mono ink" font-size="12">Sonnet, high</text><path d="M682 144H698M693 139L698 144L693 149" class="lnm" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="704" y="92" width="196" height="104" rx="12" class="card" stroke-width="1"/><rect x="705" y="106" width="4" height="76" rx="2" class="r3"/><text x="722" y="122" class="ink b" font-size="14.5">4. Then the model</text><text x="722" y="146" class="mut" font-size="13">From high, the next</text><text x="722" y="165" class="mut" font-size="13">stronger model:</text><text x="722" y="184" class="mono ink" font-size="12">complex, Opus, high</text><path d="M130.0 218H802.0" class="ln" stroke-width="3" stroke-linecap="round"/><circle cx="130.0" cy="218" r="5" class="faint"/><circle cx="354.0" cy="218" r="5" class="faint"/><circle cx="578.0" cy="218" r="5" class="faint"/><circle cx="802.0" cy="218" r="5" class="faint"/><g class="rtok"><circle cx="802.0" cy="218" r="11" class="halo" fill="none" stroke-width="5"/><circle cx="802.0" cy="218" r="9" class="rt"/></g><text x="32" y="264" class="mut" font-size="13">The next model runs at its own level's effort; with no stronger usable model, one more effort step, at</text><text x="32" y="284" class="mut" font-size="13">most max. Not a redo: the same call sent again unmarked. Run as named: a redo that names its own model or</text><text x="32" y="304" class="mut" font-size="13">effort. Never redone: a workflow stage. A background agent's call counts as finished when the agent stops</text><text x="32" y="324" class="mut" font-size="13">with an answer.</text>
</svg>
